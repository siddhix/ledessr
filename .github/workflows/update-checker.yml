name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  REPO_FULL: siddhix/ledessr

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */18 * * *

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Get upstream latest commit
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache commit hash
        id: cacheHash
        uses: actions/cache@v6
        with:
          path: .commit.txt
          key: ${{ steps.getHash.outputs.commitHash }}

      - name: Save new commit hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} > .commit.txt

      # 原生gh api触发编译，不再使用 peter-evans/repository-dispatch@v2
      - name: Trigger openwrt build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api --method POST repos/${{ env.REPO_FULL }}/dispatches -f event_type=build-openwrt

      # 原生gh api清理旧运行记录，不再使用 Mattraks/delete-workflow-runs@v2
      - name: Delete old workflow runs (keep latest 1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取当前workflow id
          WF_ID=$(gh api repos/${{ env.REPO_FULL }}/actions/workflows | jq -r '.workflows[] | select(.name == "Update Checker") | .id')
          # 列出所有运行，按时间倒序，跳过最新1条，其余删除
          gh api repos/${{ env.REPO_FULL }}/actions/workflows/$WF_ID/runs --paginate | jq -r '.workflow_runs[1:] | .[] | .id' | while read -r RUN_ID; do
            gh api --method DELETE repos/${{ env.REPO_FULL }}/actions/runs/$RUN_ID
          done
