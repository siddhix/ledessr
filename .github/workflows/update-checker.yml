name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  WORKFLOW_FILE: build.yml
  REPO_FULL: siddhix/ledessr

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */18 * * *

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get upstream latest commit
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache commit hash
        id: cacheHash
        uses: actions/cache@v6
        with:
          path: .commit
          key: ${{ steps.getHash.outputs.commitHash }}

      - name: Save new commit hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} > .commit

      - name: Trigger build workflow (curl原生API)
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ env.REPO_FULL }}/actions/workflows/${{ env.WORKFLOW_FILE }}/dispatches \
            -d '{"ref":"master"}'

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 2
