name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  WORKFLOW_FILE: openwrt-builder.yml
  REPO_FULL: siddhix/ledessr

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */18 * * *

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Get upstream latest commit
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache commit hash
        id: cacheHash
        uses: actions/cache@v6
        with:
          path: .commit.txt
          key: ${{ steps.getHash.outputs.commitHash }}

      - name: Save new commit hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} > .commit.txt

      - name: Generate GitHub App token
        id: gen_token
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repository: ${{ env.REPO_FULL }}

      - name: Trigger openwrt-builder
        if: steps.cacheHash.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ steps.gen_token.outputs.token }}
        run: |
          curl -L -X POST \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ env.REPO_FULL }}/actions/workflows/${{ env.WORKFLOW_FILE }}/dispatches \
            -d '{"ref":"main"}'

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ steps.gen_token.outputs.token }}
          repository: ${{ env.REPO_FULL }}
          retain_days: 1
