name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  REPO_FULL: siddhix/ledessr

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */18 * * *

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Get upstream latest commit
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache commit hash
        id: cacheHash
        uses: actions/cache@v6
        with:
          path: .commit.txt
          key: ${{ steps.getHash.outputs.commitHash }}

      - name: Save new commit hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} > .commit.txt

      # GitHub App 生成临时 token
      - name: Generate GitHub App token
        id: gen_token
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repository: ${{ env.REPO_FULL }}

      # ========== P3TERX原版核心：repository-dispatch ==========
      - name: Trigger build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ steps.gen_token.outputs.token }}
          repository: ${{ env.REPO_FULL }}
          event-type: build-openwrt

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ steps.gen_token.outputs.token }}
          repository: ${{ env.REPO_FULL }}
          retain_days: 1
